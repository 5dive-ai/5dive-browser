name: browser plugin

# The whole repo is one plugin, so there is no path filter to get wrong: any push
# or PR here touches browser. (The registry's parity.yml fenced by path and that
# fence is exactly what let telegram-pi ship with no CI for its whole lifetime —
# DIVE-2374. One plugin per repo removes the fence rather than widening it.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain bash, no bun deps, no Chrome: the suite drives the real bin/browser
      # as a subprocess with a FAKE google-chrome first on PATH. It grades the
      # shipped script, the manifest and this repo's marketplace entry.
      - name: browser plugin harness
        run: bash tests/browser_plugin_unit.sh
      # DIVE-6228: one answer per Google sign-in page (chooser allowed; password,
      # code, robot check, adding an account stop; a wider grant asks). Pure node.
      - name: google sign-in classifier harness
        run: bash tests/browser_google_signin_unit.sh
      # DIVE-6241: a challenge needs a page check, and a login page offering
      # "Continue with Google" is handed back for that button. Pure node, real captures.
      - name: page check harness
        run: bash tests/browser_page_check_unit.sh
      # DIVE-6965: the ref walk enters shadow roots and offers role-less clickables.
      # A DOM shim with an inherited cursor, pure node, three mutants.
      - name: page map harness
        run: bash tests/browser_page_map_unit.sh
      # DIVE-6966: the walk enters drawn child frames; a frame ref resolves to one
      # selector that enters it. A page/frame shim, pure node, four mutants.
      - name: frames harness
        run: bash tests/browser_frames_unit.sh
      # DIVE-6317: Cloudflare's "Just a moment..." is watched in the same page load
      # before it is a stop. A fake page, pure node.
      - name: interstitial wait harness
        run: bash tests/browser_interstitial_unit.sh
      # DIVE-6778: the act settle ends when the page is quiet, and a covered click
      # gets 1.5 s. Fake pages, pure node, real timers.
      - name: settle harness
        run: bash tests/browser_settle_unit.sh
      # DIVE-7303: `session-daemon call` reads a multi-MB reply in linear time and
      # never cuts a character split across chunks. A fake daemon, pure node.
      - name: call stream harness
        run: bash tests/browser_call_stream_unit.sh
      # DIVE-6089: setup installs a missing box stack. apt, npm, curl, gpg faked on
      # a sandbox PATH, so the runner's own chrome, Xvfb and node are invisible.
      - name: setup stack harness
        run: bash tests/browser_setup_stack_unit.sh
      # DIVE-7076: a page verb on a new site joins the default group that holds a
      # sign-in; a fake google-chrome records which profile each render ran in.
      - name: page-join harness
        run: bash tests/browser_page_join_unit.sh
      # DIVE-7075: setup after the hires gives each storeless registry seat its store.
      # id, chown, systemctl and visudo faked: no account, unit or sudoers is touched.
      - name: setup back-fill harness
        run: bash tests/browser_setup_backfill_unit.sh
      # DIVE-4992: the agent-initiated Connect request and its privileged half.
      # Loopback stubs for Telegram and shelld, a fake relay-seat browser.
      - name: connect-request harness
        run: bash tests/browser_connect_request_unit.sh
      # DIVE-6219: opt-in login links on a self-hosted box; a hosted box untouched.
      # The real login-link server on loopback, a fake viewer-redeem and bridge.
      - name: login-link harness
        run: bash tests/browser_login_link_unit.sh
      # DIVE-7223: typing on a phone in that page: Gboard-style key sequences into the
      # bar's field, what reaches the box read off a fake noVNC; the old hidden-input
      # handler is the control. Pure node.
      - name: viewer keyboard harness
        run: bash tests/browser_viewer_keyboard_unit.sh
      # DIVE-7257: the viewer for one site of a sign-in group shows that site's tab
      # (the real daemon on a several-tab stub; the pre-fix tree is the control).
      - name: viewer site tab harness
        run: bash tests/browser_viewer_front_unit.sh
      # DIVE-7078: no Telegram on a self-hosted box: the ask waits in the owner's login
      # shell, `asks open` is the tap and `asks done` the Done. A fake relay-seat browser.
      - name: connect-in-the-login-shell harness
        run: bash tests/browser_connect_shell_unit.sh
      - name: connect-in-the-app-chat harness
        run: bash tests/browser_connect_app_unit.sh
      # DIVE-7164: the way to the pay page is not a payment; one owner yes.
      - name: pay-check harness
        run: bash tests/browser_pay_checkout_unit.sh
      # DIVE-4997: reflex drafts a login check, the owner approves it, drift.
      # A fake reflex CLI whose candidates really match the fixtures.
      - name: reflex propose harness
        run: bash tests/browser_reflex_propose_unit.sh
      # DIVE-5190: each launch's own TMPDIR, removed on exit and reaped after a
      # kill — graded through the real bin/browser with a fake Chrome.
      # DIVE-6582: read keeps a page's label/value tables (the infobox), a bare
      # status probes side by side, snapshot/act print a small page inline.
      - name: browser read tables harness
        run: bash tests/browser_read_tables_unit.sh
      - name: browser tmpdir harness
        run: bash tests/browser_tmpdir_unit.sh
      # DIVE-5638: a launch does not depend on the seat's $HOME — a long seat
      # name (socket path) or an unwritable ~/.config (crashpad, rc 133).
      - name: browser launch environment harness
        run: bash tests/browser_launch_env_unit.sh
      # DIVE-6345: Claude in Chrome for an agent, opt-in — policy on/off, the
      # home link, the own-login scope check and the routing on sign-in stops.
      - name: browser claude in chrome harness
        run: bash tests/browser_claude_in_chrome_unit.sh
      # DIVE-5375: a probe's Chrome that never exits is stopped at budget + slack,
      # frees the profile, and a stale one-shot headless holder is reaped.
      - name: browser probe timeout harness
        run: bash tests/browser_probe_timeout_unit.sh
      # DIVE-5528: two serves of one site wait on one lock, and a session daemon
      # no pidfile names is stopped so the site can be served again.
      - name: serve race harness
        run: bash tests/browser_serve_race_unit.sh
      # DIVE-5388: served sites checked through their own browser, a headless bot
      # check is `unverifiable` not "Needs you", and the generic header check.
      - name: served probe and generic check harness
        run: bash tests/browser_served_probe_unit.sh
      # DIVE-7079: two sites of one sign-in group are never probed at once (one
      # Chrome per profile dir), and the shopify.com adapter's both halves.
      - name: status group serial harness
        run: bash tests/browser_status_group_serial_unit.sh
      # DIVE-5287: input mode. Routing through the real bin/browser with a fake
      # daemon, lib/x11.cjs unit arms, and LIVE arms against the runner's own
      # Xvfb + Chrome (real XTEST input, isTrusted, navigator.webdriver false).
      # DIVE-5342: a red live arm prints the window stack at its click point and
      # saves the screen here; the upload below keeps it with the failed run.
      - name: input drive mode harness
        run: bash tests/browser_input_drive_unit.sh
        env:
          INPUT_HARNESS_ARTIFACTS: ${{ runner.temp }}/input-harness
      # DIVE-7237: the box's logins share one Chrome. A page verb re-serves it the
      # way its site needs, a brokered seat restarts it itself, status never moves
      # it (fake daemon); act's DOM upload (playwright stub + live Chrome); input
      # mode's paste (bare Xvfb + fake daemon; its live arm is L15 above).
      - name: group window harness
        run: bash tests/browser_group_window_unit.sh
      - name: act upload harness
        run: bash tests/browser_act_upload_unit.sh
      - name: input paste harness
        run: bash tests/browser_input_paste_unit.sh
      - name: keep the input harness screens of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: input-harness-screens
          path: ${{ runner.temp }}/input-harness
          if-no-files-found: ignore
      # DIVE-6646: a phone at the login-link viewer gets the browser window fitted
      # to it (the site's phone layout, about 1:1), a desktop gets nothing, and
      # the window is given back when the view ends. LIVE on the runner's Xvfb +
      # Chrome; the screens before, during and after are kept on every run.
      - name: viewer phone fit harness
        run: bash tests/browser_viewer_fit_unit.sh
        env:
          VIEWER_FIT_ARTIFACTS: ${{ runner.temp }}/viewer-fit
      - name: keep the viewer fit screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-fit-screens
          path: ${{ runner.temp }}/viewer-fit
          if-no-files-found: ignore
      # DIVE-7204: no "Restore pages?" bubble after a served Chrome is killed. Unit
      # arms, then LIVE on the runner's Xvfb + Chrome: kill -9, a control with the old
      # flags shows the bubble, the daemon's relaunch does not. Both screens kept.
      - name: restore bubble harness
        run: bash tests/browser_restore_bubble_unit.sh
        env:
          RESTORE_BUBBLE_ARTIFACTS: ${{ runner.temp }}/restore-bubble
      - name: keep the restore bubble screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-bubble-screens
          path: ${{ runner.temp }}/restore-bubble
          if-no-files-found: ignore
      # DIVE-5335: routines (act --record, replay) and delta snapshots, through
      # the real bin/browser and driver with the recording playwright stub.
      - name: routine and delta harness
        run: bash tests/browser_routine_delta_unit.sh
      # DIVE-6651: act --expect grades the text on screen, never hidden markup;
      # a toast the poll caught still verifies (DIVE-4983).
      - name: act expect harness
        run: bash tests/browser_act_expect_visible_unit.sh
      # DIVE-5336: the owner's authenticator seed. LAST among the harnesses, because
      # its live arm needs the pinned playwright-core installed next to the plugin,
      # and the suites above grade the executor's "playwright is absent" refusals.
      - name: install the pinned playwright-core
        run: npm install --prefix browser --no-audit --no-fund
      - name: totp harness
        run: bash tests/browser_totp_unit.sh
      # DIVE-6013: profile groups — two sites in one group share a sign-in, another
      # group does not, a pre-upgrade profile resolves unchanged; the L arms set a
      # real Google cookie through one site and read it from the other in real Chrome.
      - name: profile groups harness
        run: bash tests/browser_groups_unit.sh
      # DIVE-5751: a file an act downloads reaches the seat. lib arms, cold `act`
      # with the recording stub, and a live arm in real Chrome against a local page.
      - name: act download harness
        run: bash tests/browser_act_download_unit.sh
      # DIVE-6844: a saved login is typed in by name and never shown. Cold act on the
      # recording stub (the transcript arm), root's half through the runner's sudo,
      # and a live sign-in page in real Chrome.
      - name: saved login harness
        run: bash tests/browser_saved_fill_unit.sh
      # DIVE-6392: a popup an act opens is followed (both loops), and an act's capture
      # says its browser mode. lib arms, cold act and the served daemon on the recording
      # stub, and live arms in real Chrome with a 1.45.0-shaped mutant as the control.
      - name: act popup harness
        run: bash tests/browser_act_popup_unit.sh
      # DIVE-6795: a served act answers with what changed (lib/look.cjs), its report
      # arrives split, and page.md is derived only for --full. Daemon on the stub.
      - name: act look harness
        run: bash tests/browser_act_look_unit.sh
      # DIVE-6732: read takes several urls in one call, loaded side by side in one
      # browser, and prints a page's head. Fake executor arms, then live arms in real
      # Chrome against a local server that counts the pages it holds at once.
      - name: read many harness
        run: bash tests/browser_read_many_unit.sh
      # DIVE-7183: a box-wide change run without sudo re-runs through sudo -n when the
      # seat may, else names the admin colleague who can. Fake sudo, no root needed.
      - name: root re-run harness
        run: bash tests/browser_root_reexec_unit.sh
      # A manifest or marketplace file that does not parse breaks `5dive plugin
      # add` at install time, where nobody is watching. Cheap, so it is its own
      # named check rather than an assertion buried in the suite.
      - name: manifests parse
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . browser/.claude-plugin/plugin.json > /dev/null
      # Contract §1: the manifest name must equal its folder name, and the
      # marketplace `source` must name that same folder. Getting this wrong is
      # invisible until an install fails rc=3 on a box (DIVE-4386, trap D).
      - name: manifest name matches its folder and the marketplace source
        run: |
          test "$(jq -r .name browser/.claude-plugin/plugin.json)" = browser
          test "$(jq -r '.plugins[]|select(.name=="browser")|.source' .claude-plugin/marketplace.json)" = ./browser

  # DIVE-5335: THE NUMBERS. A fixed routine on a real site, run 1 (snapshot +
  # act) against runs 2 and 3 (replay), with real Chrome and the pinned
  # playwright-core; plus full vs --delta re-reads. The table lands in the job
  # summary, and the job fails if run 3 does not make fewer model calls than
  # run 1. Its own job: it needs the network and a real browser, the harness
  # job needs neither.
  routine-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pinned playwright-core
        run: npm install --prefix browser --no-audit --no-fund
      - name: run 1 vs run 3 on en.wikipedia.org
        run: bash tests/browser_routine_bench.sh
