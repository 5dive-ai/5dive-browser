<!-- wappi.pro/login, public, fetched 2026-11-15 (DIVE-8523): the login form as served, csrf token and icon removed -->
<html><head><title>Вход - Wappi</title></head><body>
<form id="login-form" method="post" action="/login">
                        <input type="hidden" name="csrfmiddlewaretoken" value="x">
                        <input type="hidden" name="device" id="login-device">
                            <div class="row">
                                <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="email" class="form-label" style="color: #1A1A1A">Email</label>
                                    <input type="email" name="email" autocomplete="username" required class="form-control" id="email" aria-describedby="email" placeholder=" " style="color: #1A1A1A">
                                </div>
                                </div>
                                <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="password" class="form-label" style="color: #1A1A1A">Пароль</label>
                                    <input type="password" name="password" autocomplete="current-password" required class="form-control" id="password" aria-describedby="password" placeholder=" " style="color: #1A1A1A">
                                </div>
                                </div>
                                <div class="col-lg-12 d-flex justify-content-between">
                                <div class="form-check mb-3">
                                    <input type="checkbox" name="remember_me" class="form-check-input" id="customCheck1">
                                    <label class="form-check-label noselect" for="customCheck1" style="color: #1A1A1A">Запомнить меня</label>
                                </div>
                                <a href="/forgot" class="c-content">Забыли пароль?</a>
                                </div>
                            </div>
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn resp-button btn-billing text-decoration-none">Войти</button>
                            </div>

                            <div class="d-flex justify-content-center mt-3">
                                <a href="/auth/yandex/start" class="yandex-id-button" aria-label="Войти с Яндекс ID">
                                    <span class="yandex-id-button__icon" aria-hidden="true"></span>
                                    <span class="yandex-id-button__text">Войти с Яндекс ID</span>
                                </a>
                            </div>
                            <div class="d-flex justify-content-center mt-2">
                                <a href="/auth/vk/start" class="vk-id-button" aria-label="Войти с VK ID">
                                    
                                    <span class="vk-id-button__text">Войти с VK ID</span>
                                </a>
                            </div>
                            <p class="mt-3 text-center" style="color:#494949">
                                Еще нет аккаунта? <a href="/registration" class="c-content">Зарегистрироваться</a>
                            </p>

                            <p class="mt-3 text-center" style="font-size:12px;color: #6c757d">
                                Авторизируясь в Wappi вы соглашаетесь с нашей <a class="textg" href="/privacy">политикой конфиденциальности</a> и <a href="/oferta" class="textg">условиями использования</a>
                            </p>
                        </form>
</body></html>
