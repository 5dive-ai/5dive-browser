     the first autocomplete=current-password), a hidden name=fake_pass anti-autofill decoy, no login form.

<html><head><title>Личный кабинет пользователя - Wappi</title></head><body>
<header><nav><a href="/dashboard">Главная</a><a href="/dashboard/agents">ИИ-Агенты</a><a href="/logout">Выйти</a></nav></header>
<input type="password" name="fake_pass" style="display:none" tabindex="-1" autocomplete="off">
<main><h1>Профили</h1><div id="feed">profiles</div></main>
<div class="modal fade" id="changePasswordModal" tabindex="-1" role="dialog">
  <div class="modal-dialog"><div class="modal-content">
    <form id="change-password-form" method="post" action="/api/user/password">
      <input type="password" id="change-password-current" autocomplete="current-password" class="form-control">
      <input type="password" id="change-password-new" class="form-control">
      <input type="password" id="change-password-repeat" class="form-control">
      <button type="submit">Сохранить</button>
    </form>
  </div></div>
</div>
</body></html>
