<!doctype html>
<html><head><title>A plain article</title></head>
<body><article><h1>A plain article</h1>
<p>This page has no tables at all. It is a paragraph of prose long enough for the extractor to call it the article, and it says nothing a reader would need a table for.</p>
<p>A second paragraph keeps the article above the extractor's floor, so the read is the article and nothing else.</p>
</article></body></html>
